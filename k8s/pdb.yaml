# Fix 14: Pod Disruption Budgets
# Ensures minimum pods stay available during node maintenance / rolling updates

---
# Backend: at least 1 pod always available (out of 2 replicas)
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend-pdb
  namespace: benchmark
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: backend

---
# Frontend: at least 1 pod always available
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend-pdb
  namespace: benchmark
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: frontend
