# Fix 7: Secrets Rotation Strategy
#
# Three approaches, from simple to enterprise-grade:
#
# ─────────────────────────────────────────────────────────────────────────────
# APPROACH 1: Manual rotation (current — acceptable for academic project)
# ─────────────────────────────────────────────────────────────────────────────
#
# Steps to rotate DB password manually:
#
#   1. Generate new password
#      NEW_PASS=$(openssl rand -base64 32)
#
#   2. Update PostgreSQL
#      kubectl exec -it deployment/postgres -n benchmark -- \
#        psql -U postgres -c "ALTER USER postgres PASSWORD '$NEW_PASS';"
#
#   3. Update Kubernetes Secret
#      kubectl create secret generic db-secret \
#        --from-literal=DB_PASSWORD="$NEW_PASS" \
#        --dry-run=client -o yaml | kubectl apply -f -
#
#   4. Restart backend and worker to pick up new secret
#      kubectl rollout restart deployment/backend -n benchmark
#      kubectl rollout restart deployment/worker  -n benchmark
#
# ─────────────────────────────────────────────────────────────────────────────
# APPROACH 2: Automated rotation via CronJob
# ─────────────────────────────────────────────────────────────────────────────

apiVersion: batch/v1
kind: CronJob
metadata:
  name: rotate-jwt-secret
  namespace: benchmark
spec:
  schedule: "0 0 1 * *"   # 1st of every month at midnight
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: secret-rotator
          containers:
            - name: rotator
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  # Generate new JWT secret
                  NEW_SECRET=$(openssl rand -base64 32)

                  # Update Kubernetes secret
                  kubectl create secret generic db-secret \
                    --from-literal=JWT_SECRET="$NEW_SECRET" \
                    --dry-run=client -o yaml | kubectl apply -f -

                  # Rolling restart — pods pick up new secret
                  kubectl rollout restart deployment/backend -n benchmark
                  kubectl rollout restart deployment/worker  -n benchmark

                  echo "JWT secret rotated successfully"

---
# ServiceAccount with minimal permissions for the rotator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secret-rotator
  namespace: benchmark
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secret-rotator-role
  namespace: benchmark
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
    resourceNames: ["backend", "worker"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secret-rotator-binding
  namespace: benchmark
subjects:
  - kind: ServiceAccount
    name: secret-rotator
    namespace: benchmark
roleRef:
  kind: Role
  name: secret-rotator-role
  apiGroup: rbac.authorization.k8s.io

# ─────────────────────────────────────────────────────────────────────────────
# APPROACH 3: HashiCorp Vault (enterprise-grade)
# ─────────────────────────────────────────────────────────────────────────────
#
# Vault provides:
#   - Dynamic secrets (DB credentials generated on-demand, expire automatically)
#   - Automatic rotation
#   - Audit logging of every secret access
#   - Fine-grained access policies
#
# Install Vault on Kubernetes:
#   helm repo add hashicorp https://helm.releases.hashicorp.com
#   helm install vault hashicorp/vault --namespace vault --create-namespace
#
# Configure dynamic PostgreSQL credentials:
#   vault secrets enable database
#   vault write database/config/benchmark \
#     plugin_name=postgresql-database-plugin \
#     connection_url="postgresql://{{username}}:{{password}}@postgres:5432/benchmarkdb" \
#     allowed_roles="backend-role" \
#     username="vault-admin" \
#     password="vault-admin-password"
#
#   vault write database/roles/backend-role \
#     db_name=benchmark \
#     creation_statements="CREATE ROLE '{{name}}' WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}';" \
#     default_ttl="1h" \
#     max_ttl="24h"
#
# Now each backend pod gets a unique DB credential that expires in 1 hour.
# Vault automatically rotates it before expiry.
