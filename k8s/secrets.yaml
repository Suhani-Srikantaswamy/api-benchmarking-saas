apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: benchmark
type: Opaque
# ⚠️  DO NOT commit real values here.
# Generate base64 values locally and apply directly:
#   kubectl create secret generic db-secret \
#     --from-literal=DB_USER=<your-user> \
#     --from-literal=DB_PASSWORD=<your-password> \
#     --from-literal=DB_NAME=benchmarkdb \
#     --from-literal=JWT_SECRET=$(openssl rand -base64 32) \
#     -n benchmark
data:
  DB_USER: REPLACE_WITH_BASE64_VALUE
  DB_PASSWORD: REPLACE_WITH_BASE64_VALUE
  DB_NAME: REPLACE_WITH_BASE64_VALUE
  JWT_SECRET: REPLACE_WITH_BASE64_VALUE
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: benchmark
type: Opaque
# ⚠️  DO NOT commit real values here.
# Apply directly:
#   kubectl create secret generic grafana-secret \
#     --from-literal=GF_SECURITY_ADMIN_PASSWORD=<your-password> \
#     -n benchmark
data:
  GF_SECURITY_ADMIN_PASSWORD: REPLACE_WITH_BASE64_VALUE
