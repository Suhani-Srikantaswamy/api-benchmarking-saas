apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: benchmark
type: Opaque
# Values are base64 encoded: echo -n 'value' | base64
# postgres  → [REDACTED_BASE64]
# benchmarkdb → YmVuY2htYXJrZGI=
data:
  DB_USER: [REDACTED_BASE64]
  DB_PASSWORD: [REDACTED_BASE64]
  DB_NAME: YmVuY2htYXJrZGI=
  # JWT_SECRET: base64 of your secret — generate with: openssl rand -base64 32 | base64
  JWT_SECRET: [REDACTED_BASE64]
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: benchmark
type: Opaque
data:
  # admin123 → [REDACTED_BASE64]
  GF_SECURITY_ADMIN_PASSWORD: [REDACTED_BASE64]
