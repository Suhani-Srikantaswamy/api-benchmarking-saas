# Fix 2 (Advanced): KEDA — Queue-Based Worker Autoscaling
#
# KEDA (Kubernetes Event-Driven Autoscaling) scales the worker deployment
# based on the number of jobs waiting in the BullMQ Redis queue.
#
# Unlike HPA (CPU/memory based), KEDA scales on BUSINESS METRICS:
#   - 0 jobs in queue → scale worker to 0 (save resources)
#   - 10 jobs in queue → scale worker to 5
#   - 50 jobs in queue → scale worker to 10 (max)
#
# Install KEDA:
#   kubectl apply -f https://github.com/kedacore/keda/releases/download/v2.13.0/keda-2.13.0.yaml
#
# Verify:
#   kubectl get scaledobject -n benchmark
#   kubectl get hpa -n benchmark   # KEDA creates an HPA automatically

---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: worker-scaledobject
  namespace: benchmark
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: worker

  # Scale between 0 and 10 replicas
  minReplicaCount: 0    # scale to zero when queue is empty (saves resources)
  maxReplicaCount: 10

  # Wait 30s before scaling down (prevents thrashing)
  cooldownPeriod: 30

  # Wait 5s before scaling up (prevents over-reaction to brief spikes)
  pollingInterval: 5

  triggers:
    - type: redis
      metadata:
        # Redis connection
        address: redis.benchmark.svc.cluster.local:6379

        # BullMQ stores jobs in a list named: bull:<queue-name>:wait
        listName: bull:load-tests:wait

        # Scale up when there are more than 2 jobs per worker replica
        # e.g., 10 jobs → ceil(10/2) = 5 replicas
        listLength: "2"

---
