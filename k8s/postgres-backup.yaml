# Fix 4: PostgreSQL Backup Strategy
#
# Implements automated pg_dump backups via a Kubernetes CronJob.
# Runs daily at 2 AM, keeps last 7 backups.
#
# For production: use managed DB (AWS RDS, Cloud SQL) with automated backups.

---
# CronJob: daily pg_dump backup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: benchmark
spec:
  schedule: "0 2 * * *"    # 2 AM every day
  concurrencyPolicy: Forbid  # don't run if previous backup is still running
  successfulJobsHistoryLimit: 7   # keep last 7 successful backups
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: pg-backup
              image: postgres:15-alpine
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: DB_PASSWORD
                - name: PGUSER
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: DB_USER
                - name: PGDATABASE
                  valueFrom:
                    secretKeyRef:
                      name: db-secret
                      key: DB_NAME
              command:
                - /bin/sh
                - -c
                - |
                  BACKUP_FILE="/backup/benchmarkdb-$(date +%Y%m%d-%H%M%S).sql.gz"
                  echo "Starting backup to $BACKUP_FILE"
                  pg_dump -h postgres -U $PGUSER $PGDATABASE | gzip > $BACKUP_FILE
                  echo "Backup complete: $(du -sh $BACKUP_FILE)"

                  # Keep only last 7 backups
                  ls -t /backup/*.sql.gz | tail -n +8 | xargs -r rm
                  echo "Cleanup done. Current backups:"
                  ls -lh /backup/
              volumeMounts:
                - name: backup-storage
                  mountPath: /backup
          volumes:
            - name: backup-storage
              persistentVolumeClaim:
                claimName: backup-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backup-pvc
  namespace: benchmark
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---
