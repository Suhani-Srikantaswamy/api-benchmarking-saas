# Fix 3: Redis High Availability
#
# For production, replace the single Redis pod with Redis Sentinel
# (3 nodes: 1 primary + 2 replicas + 3 sentinels).
#
# OPTION A: Redis Sentinel (self-managed, works on Minikube)
# OPTION B: Managed Redis (AWS ElastiCache, GCP Memorystore) — recommended for production
#
# ─────────────────────────────────────────────────────────────────────────────
# OPTION A: Redis Sentinel via Helm (easiest self-managed HA)
# ─────────────────────────────────────────────────────────────────────────────
#
# Install:
#   helm repo add bitnami https://charts.bitnami.com/bitnami
#   helm install redis bitnami/redis \
#     --namespace benchmark \
#     --set architecture=replication \
#     --set sentinel.enabled=true \
#     --set sentinel.masterSet=benchmark-master \
#     --set replica.replicaCount=2 \
#     --set auth.enabled=false
#
# This creates:
#   - 1 Redis primary (read/write)
#   - 2 Redis replicas (read-only, auto-promoted on primary failure)
#   - 3 Sentinel pods (monitor primary, trigger failover)
#
# Update backend/worker env to use Sentinel:
#   REDIS_HOST: redis-headless.benchmark.svc.cluster.local
#   REDIS_SENTINEL_NAME: benchmark-master
#
# ─────────────────────────────────────────────────────────────────────────────
# OPTION B: AWS ElastiCache (production recommendation)
# ─────────────────────────────────────────────────────────────────────────────
#
# In terraform/main.tf add:
#
# resource "aws_elasticache_replication_group" "redis" {
#   replication_group_id          = "benchmark-redis"
#   description                   = "Redis for benchmark queue"
#   node_type                     = "cache.t3.micro"
#   num_cache_clusters            = 2
#   automatic_failover_enabled    = true
#   at_rest_encryption_enabled    = true
#   transit_encryption_enabled    = true
# }
#
# ─────────────────────────────────────────────────────────────────────────────
# For this academic project: single Redis is acceptable
# Document the HA approach for viva — shows awareness of production concerns
# ─────────────────────────────────────────────────────────────────────────────

# Minimal Redis with persistence (current setup — acceptable for project)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: benchmark
  labels:
    app: redis
    tier: cache
    ha-mode: single-instance   # label documents the limitation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
      annotations:
        # Document the known limitation
        note: "Single instance — upgrade to Redis Sentinel or ElastiCache for production HA"
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly yes          # AOF persistence
            - --appendfsync everysec    # fsync every second (balance perf/durability)
            - --maxmemory 256mb
            - --maxmemory-policy allkeys-lru  # evict LRU keys when full
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-pvc
