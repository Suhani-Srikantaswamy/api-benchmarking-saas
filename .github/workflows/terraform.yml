name: Terraform CI/CD

# Runs on manual trigger or when terraform files change.
# Plan/Apply/Destroy require KUBE_CONFIG secret to be set.
# For local/Minikube usage, run terraform commands directly from your terminal.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action to run'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

  push:
    branches: [main]
    paths:
      - 'terraform/**'
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'

env:
  TF_VERSION: '1.5.7'
  WORKING_DIR: './terraform'

jobs:
  # ── Validate (syntax + format check — no provider connection needed) ──────────
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Use -backend=false so no provider/cluster connection is needed
      - name: Terraform Init (no backend)
        run: terraform init -backend=false -input=false
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Validate
        run: terraform validate
        working-directory: ${{ env.WORKING_DIR }}

      # Format check is informational only — does not fail the pipeline
      - name: Terraform Format Check
        run: terraform fmt -check -recursive || echo "⚠ Some files need formatting (run: terraform fmt)"
        working-directory: ${{ env.WORKING_DIR }}
        continue-on-error: true

  # ── Plan (manual trigger or PR) ───────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.action == 'plan' || github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Plan
        run: |
          terraform plan \
            -var="dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -no-color
        working-directory: ${{ env.WORKING_DIR }}

  # ── Apply (manual trigger only) ───────────────────────────────────────────────
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.action == 'apply'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Apply
        run: |
          terraform apply \
            -var="dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -auto-approve -no-color
        working-directory: ${{ env.WORKING_DIR }}

  # ── Destroy (manual trigger only) ─────────────────────────────────────────────
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.inputs.action == 'destroy'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.WORKING_DIR }}

      - name: Terraform Destroy
        run: |
          terraform destroy \
            -var="dockerhub_username=${{ secrets.DOCKERHUB_USERNAME }}" \
            -var="db_password=${{ secrets.DB_PASSWORD }}" \
            -auto-approve -no-color
        working-directory: ${{ env.WORKING_DIR }}
