name: CI/CD Pipeline — API Benchmark SaaS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Validate Backend ───────────────────────────────────────────────────
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check syntax of all JS files
        run: |
          find src -name "*.js" | xargs -I{} node --check {}
          echo "✓ Syntax check passed"
        working-directory: backend

  # ── Job 2: Build Frontend ─────────────────────────────────────────────────────
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  # ── Job 3: Build & Scan Backend Docker Image ──────────────────────────────────
  build-backend-image:
    name: Build & Scan Backend Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (local tag)
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: benchmark-backend:${{ github.sha }}
          load: true

      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: benchmark-backend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Push to Docker Hub
        if: |
          github.ref == 'refs/heads/main' &&
          secrets.DOCKERHUB_USERNAME != '' &&
          secrets.DOCKERHUB_TOKEN != ''
        run: |
          echo "Docker Hub secrets are set — pushing image"
        # Actual push only runs when secrets are configured
        # Uncomment the steps below once DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
        # are added to your repository secrets (Settings → Secrets → Actions)

      # Uncomment once Docker Hub secrets are configured:
      # - name: Login to Docker Hub
      #   if: github.ref == 'refs/heads/main'
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # - name: Tag and push backend image
      #   if: github.ref == 'refs/heads/main'
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: ./backend
      #     push: true
      #     tags: |
      #       ${{ secrets.DOCKERHUB_USERNAME }}/benchmark-backend:${{ github.sha }}
      #       ${{ secrets.DOCKERHUB_USERNAME }}/benchmark-backend:latest

  # ── Job 4: Build & Scan Frontend Docker Image ─────────────────────────────────
  build-frontend-image:
    name: Build & Scan Frontend Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image (local tag)
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: benchmark-frontend:${{ github.sha }}
          load: true

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: benchmark-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      # Uncomment once Docker Hub secrets are configured:
      # - name: Login to Docker Hub
      #   if: github.ref == 'refs/heads/main'
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}
      #
      # - name: Tag and push frontend image
      #   if: github.ref == 'refs/heads/main'
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: ./frontend
      #     push: true
      #     tags: |
      #       ${{ secrets.DOCKERHUB_USERNAME }}/benchmark-frontend:${{ github.sha }}
      #       ${{ secrets.DOCKERHUB_USERNAME }}/benchmark-frontend:latest
