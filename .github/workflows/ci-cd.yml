name: CI/CD Pipeline — API Benchmark SaaS

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Cancel any in-progress run for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: docker.io
  BACKEND_IMAGE:  ${{ secrets.DOCKERHUB_USERNAME }}/benchmark-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/benchmark-frontend

jobs:
  # ── Job 1: Validate Backend ───────────────────────────────────────────────────
  validate-backend:
    name: Validate Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check syntax of all JS files
        run: |
          find src -name "*.js" | xargs -I{} node --check {}
          echo "Syntax check passed"
        working-directory: backend

  # ── Job 2: Build & Scan Backend ──────────────────────────────────────────────
  build-backend:
    name: Build & Scan Backend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate-backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          load: true

      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:      ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          format:         'table'
          exit-code:      '0'
          ignore-unfixed: true
          vuln-type:      'os,library'
          severity:       'CRITICAL'

      - name: Push backend image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

  # ── Job 3: Build Frontend ─────────────────────────────────────────────────────
  build-frontend:
    name: Build & Scan Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build frontend
        run: |
          npm ci
          npm run build
        working-directory: frontend

      - uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          load: true

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref:      ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          format:         'table'
          exit-code:      '0'
          ignore-unfixed: true
          vuln-type:      'os,library'
          severity:       'CRITICAL'

      - name: Push frontend image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
